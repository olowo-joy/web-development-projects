<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact - Joy Olowogbade</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div class="logo">
        <a href="index.html">
          <img src="images/logo.png" alt="Joy Headshot" class="logo-img" />
          <h1>Joy Olowogbade</h1>
        </a>
      </div>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About Me</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a href="gallery.html">Gallery</a></li>
          <li><a class="active" href="contact.html">Contact</a></li>
        </ul>
      </nav>
      <button id="mode-toggle" aria-label="Toggle Dark/Light Mode">Dark/Light Mode</button>
      <div class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </header>

    <main>
      <section id="contact">
        <h2>Contact Me</h2>
        <form id="contactForm" novalidate>
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" required />

          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required />

          <label for="message">Message:</label>
          <textarea id="message" name="message" rows="5" required></textarea>

          <button type="submit">Send Message</button>
        </form>
        <div id="formNotification" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2025 Joy Olowogbade. All rights reserved.</p>
    </footer>

    <script src="js/script.js"></script>
  </body>
</html>
